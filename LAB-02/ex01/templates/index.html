<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="hutech" style="display: block; margin-left: auto; margin-right: auto; width: 30%;">
        <h3 class="font-weight-bold text-center mt-4 mb-5">CAESAR CIPHER</h3>

        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <h6 class="font-weight-bold">ENCRYPTION</h6>
                <div class="form-group">
                    <label>Plain text:</label>
                    <input type="text" id="plainText" class="form-control" value="HUTECH">
                </div>
                <div class="form-group">
                    <label>Key:</label>
                    <input type="number" id="encryptKey" class="form-control" value="5">
                </div>
                <button class="btn btn-dark mb-2" onclick="encrypt()">Encrypt</button>
                <div class="form-group">
                    <input type="text" id="encryptResult" class="form-control border-0 bg-transparent text-primary font-weight-bold" readonly>
                </div>

                <hr style="border-top: 1px solid #ccc; margin: 30px 0;">

                <h6 class="font-weight-bold">DECRYPTION</h6>
                <div class="form-group">
                    <label>Cipher text:</label>
                    <input type="text" id="cipherText" class="form-control" value="MZYJHM">
                </div>
                <div class="form-group">
                    <label>Key:</label>
                    <input type="number" id="decryptKey" class="form-control" value="5">
                </div>
                <button class="btn btn-dark mb-2" onclick="decrypt()">Decrypt</button>
                <div class="form-group">
                    <input type="text" id="decryptResult" class="form-control border-0 bg-transparent text-primary font-weight-bold" readonly>
                </div>

            </div>
        </div>
    </div>

    <script>
        async function encrypt() {
            const text = document.getElementById('plainText').value;
            const key = document.getElementById('encryptKey').value;
            if (!text) { alert('Vui lòng nhập văn bản!'); return; }

            try {
                const response = await fetch('/api/caesar/encrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plain_text: text, key: key })
                });
                const result = await response.json();
                document.getElementById('encryptResult').value = "Encrypted text: " + result.encrypted_message;
            } catch (error) {
                alert('Lỗi kết nối API!');
            }
        }

        async function decrypt() {
            const text = document.getElementById('cipherText').value;
            const key = document.getElementById('decryptKey').value;
            if (!text) { alert('Vui lòng nhập văn bản!'); return; }

            try {
                const response = await fetch('/api/caesar/decrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cipher_text: text, key: key })
                });
                const result = await response.json();
                document.getElementById('decryptResult').value = "Decrypted text: " + result.decrypted_message;
            } catch (error) {
                alert('Lỗi kết nối API!');
            }
        }
    </script>
</body>
</html>
